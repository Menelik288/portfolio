    <circle cx="420" cy="140" r="1.8" opacity=".9"/><circle cx="520" cy="620" r="1.2" opacity=".55"/>
    <circle cx="700" cy="80" r="1.3" opacity=".7"/><circle cx="880" cy="500" r="1.6" opacity=".65"/>
    <circle cx="1020" cy="180" r="1.1" opacity=".5"/><circle cx="1180" cy="400" r="1.9" opacity=".85"/>
    <circle cx="1380" cy="150" r="1.3" opacity=".6"/><circle cx="1500" cy="520" r="1.5" opacity=".7"/>
    <circle cx="200" cy="700" r="1.4" opacity=".6"/><circle cx="640" cy="810" r="1.2" opacity=".5"/>
    <circle cx="960" cy="760" r="1.7" opacity=".75"/><circle cx="1440" cy="840" r="1.1" opacity=".5"/>
    <circle cx="340" cy="470" r="1.3" opacity=".6"/><circle cx="1260" cy="620" r="1.2" opacity=".55"/>
  </g>

  <g fill="none" stroke="#ff6a00" stroke-opacity=".12">
