<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Astronaut drifting among orbiting planets">
  <defs>
    <radialGradient id="sky" cx="62%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#241208"/>
      <stop offset="55%" stop-color="#140a04"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </radialGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa15c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffa15c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globe" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffd9b0"/>
      <stop offset="60%" stop-color="#c8782f"/>
      <stop offset="100%" stop-color="#3a1c08"/>
