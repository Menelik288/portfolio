    <circle cx="-7" cy="-14" r="7" fill="#ff8a3d" opacity=".7"/>
    <rect x="-30" y="26" width="60" height="74" rx="18" fill="url(#suit)"/>
    <rect x="-10" y="42" width="20" height="18" rx="5" fill="#ff6a00" opacity=".9"/>
    <rect x="-62" y="30" width="34" height="15" rx="7" fill="url(#suit)" transform="rotate(-28 -45 38)"/>
    <rect x="28" y="30" width="34" height="15" rx="7" fill="url(#suit)" transform="rotate(28 45 38)"/>
    <rect x="-26" y="96" width="17" height="52" rx="8" fill="url(#suit)" transform="rotate(-10 -18 120)"/>
    <rect x="9" y="96" width="17" height="52" rx="8" fill="url(#suit)" transform="rotate(12 18 120)"/>
