    <radialGradient id="globe2" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffb27a"/>
      <stop offset="70%" stop-color="#8f4512"/>
      <stop offset="100%" stop-color="#2a1205"/>
    </radialGradient>
    <radialGradient id="suit" cx="38%" cy="28%" r="80%">
